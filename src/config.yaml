  merge_dir: ../data/raw/merge
  output_root: ../outputs/training
  next_day_dir: ../data/raw/QMI_NEXT_DAY

signal:
  target_hz: 5
  window_seconds: 4.0
  feature_count: 4
  gravity: 9.80665

windowing:
  inference_stride_samples: 5
  max_weda_nonfall_windows_train: 4
